name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 两个后端（Java 与 TS）各跑一遍 spec/ 下共用的样例；action 的版本照 query 仓库固定到提交

jobs:
  java:
    name: Java 测试（含 MySQL 实库）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 实库测试的库：flow_it，用户 flow（测试专用，密码不是机密）
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flow_it
          MYSQL_USER: flow
          MYSQL_PASSWORD: flow-ci
          MYSQL_ROOT_PASSWORD: flow-ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uflow -pflow-ci"
          --health-interval 3s --health-timeout 3s --health-retries 40
    env:
      FLOW_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/flow_it
      FLOW_MYSQL_USER: flow
      FLOW_MYSQL_PASSWORD: flow-ci
      FLOW_REQUIRE_LIVE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # flow 依赖 query 主干的 SNAPSHOT（根 pom 的 query.version）：先把 query 装进本机的 Maven 仓库
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kenconnet666/query
          path: query
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 安装 query 的 SNAPSHOT
        working-directory: query
        run: ./mvnw --batch-mode install -DskipTests -pl java/wire,java/query-core,java/query-mysql,java/query-spring -am
      - name: 编译并运行全部测试
        run: ./mvnw --batch-mode --threads 1C verify

  typescript:
    name: TypeScript 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: typescript/package.json
          cache: true
          cache_dependency_path: typescript/pnpm-lock.yaml
      # 前端（packages/ui、apps/demo）按源码用组件库 vue-tsx-pro：检出到本仓库的旁边（link: 指向 ../vue-tsx-pro），
      # 装好它的依赖、构建编译器（Vite 插件读 dist）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kenconnet666/vue-tsx-pro
          path: vue-tsx-pro
      - name: 组件库放到旁边并构建编译器
        working-directory: .
        run: |
          mv vue-tsx-pro ../vue-tsx-pro
          cd ../vue-tsx-pro
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @zerodep-dev/vue-tsx-pro-tsx build
      - name: 安装、构建并运行全部测试
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck:ui
          pnpm test:ui
