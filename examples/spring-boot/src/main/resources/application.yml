# 示例应用的配置。连接从环境变量取（不要把密码写进文件）：
#   FLOW_MYSQL_URL=jdbc:mysql://主机:端口/库名  FLOW_MYSQL_USER=…  FLOW_MYSQL_PASSWORD=…
spring:
  datasource:
    url: ${FLOW_MYSQL_URL}
    username: ${FLOW_MYSQL_USER}
    password: ${FLOW_MYSQL_PASSWORD}
  flyway:
    # 应用自己没有 Flyway 迁移；引擎的表由下面 flow.flyway 那一套建
    enabled: false

# 引擎用 easy-query 的 starter 建的 EasyEntityQuery 读写（表名、列名按默认的下划线命名）
easy-query:
  enable: true
  database: mysql

flow:
  flyway:
    enabled: true        # 启动时执行引擎的建表脚本（单独的历史表 flow_schema_history）
  http:
    enabled: true        # 打开引擎自带的接口：/flow/commands/*、/flow/queries/*
    path: /flow
  jobs:
    interval: 5s         # 定时节点、超时、提醒：每 5 秒看一次到期的作业（默认 10 秒）
  calendar:
    zone: Asia/Shanghai  # "工作日"按北京时间的日期算
  idempotency:
    retention: 24h       # 带 Idempotency-Key 的命令记录留多久（默认 24 小时），过期的每小时删一次
  designer:
    node-meta:           # 节点的业务信息：设计器的节点面板多一块"业务信息"，填的值写进节点的 meta，接入方的监听读它同步业务表
      - key: bizStatus
        label: 业务状态
        type: select
        description: 单据停在这个节点时列表上显示的状态
        options:
          - { value: accepting, label: 受理中 }
          - { value: reviewing, label: 审核中 }
          - { value: closed, label: 已办结 }

demo:
  amount-threshold: 10000  # 计算值 demo.amountLevel 的阈值：金额达到它算 high
  reset:
    enabled: true          # POST /demo/reset 清空引擎的数据（示例前端顶栏的"重置演示"）；演示站点以外设成 false
