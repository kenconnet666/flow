packages:
  - packages/*
  - apps/*
  - test

# 前端（packages/ui、apps/*）共用的依赖版本，同 vue-tsx-pro 的 catalog；各包用 "catalog:" 引用
catalog:
  # 表单工具从源码取字段清单（只用解析器），版本同 vue-tsx-pro 的编译器
  '@babel/parser': 8.0.7
  '@babel/types': 8.0.6
  vue: 3.5.44
  vue-router: 5.4.0
  zod: 4.6.7
  decimal.js: 10.6.0
  '@lucide/icons': 1.59.0
  '@internationalized/date': 3.12.4
  vite: 8.3.4
  vitest: 5.0.5
  happy-dom: 21.0.3
  '@types/node': 24.19.2
